# MkDocs project config at repository root (docs_dir is docs/). Theme assets live under docs/.
# Build: task docs:build   or: mkdocs build -f mkdocs.yml --site-dir .build/site

site_name: Directory documentation
site_url: https://agntcy.github.io/dir/

docs_dir: docs

exclude_docs: |
  hooks.py
  main.py
  mike_version.py
  mike_versions.ini
  Taskfile.yml
  requirements.txt
  requirements-lint.txt
  codespellrc
  pymarkdown.yaml
  lychee.toml

repo_name: agntcy/dir
repo_url: https://github.com/agntcy/dir
edit_uri: edit/main/docs/

extra:
  version:
    provider: mike
  var:
    docs_url: https://agntcy.github.io/dir/
    repo_url: https://github.com/agntcy/dir
    repo_slug: agntcy/dir
    org: AGNTCY

  copyright: Copyright AGNTCY Contributors.

extra_css:
  - stylesheets/agntcy-docs.css

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

hooks:
  - docs/hooks.py

plugins:
  search:
  mike:
    alias_type: redirect
  redirects:
    redirect_maps: {}
  awesome-pages:
    filename: ".index"
    collapse_single_pages: true
    strict: false

theme:
  name: material
  custom_dir: docs/overrides

  features:
    - announce.dismiss
    - content.action.edit
    - content.action.view
    - content.code.annotate
    - content.code.copy
    - content.tabs.link
    - content.tooltips
    - navigation.footer
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow

  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/link
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/toggle-switch
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/toggle-switch-off
        name: Switch to system preference
  font:
    text: Roboto
    code: Roboto Mono
  favicon: assets/agntcy/favicon.ico
  logo_light: assets/agntcy/img/logo-light.svg
  logo_dark: assets/agntcy/img/logo-dark.svg
